<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <title>The Approach</title>
  <desc>A dark starry sky over rolling hills that lead toward a distant greenhouse.</desc>
  
  <!-- Sky -->
  <rect x="0" y="0" width="300" height="300" fill="#141a30"/>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="1" fill="#c3bdab"/>
  <circle cx="85" cy="20" r="1" fill="#c3bdab"/>
  <circle cx="150" cy="70" r="1.5" fill="#c3bdab"/>
  <circle cx="210" cy="35" r="1" fill="#c3bdab"/>
  <circle cx="270" cy="90" r="1" fill="#c3bdab"/>
  <circle cx="110" cy="120" r="1" fill="#c3bdab"/>
  <circle cx="45" cy="150" r="1.5" fill="#c3bdab"/>
  
  <!-- Distant Hill matching y=228 at x=300 -->
  <polygon points="0,250 80,240 180,215 300,228 300,300 0,300" fill="#203748"/>
  
  <!-- Foreground Hill matching y=260 at x=300 -->
  <polygon points="0,300 50,280 150,275 250,255 300,260 300,300 0,300" fill="#294b4f"/>
  
  <!-- A subtle path or features using neighbor colors -->
  <polygon points="20,300 40,300 60,290 30,290" fill="#879182"/>
  <polygon points="50,285 70,285 85,280 60,280" fill="#879182"/>
  <polygon points="80,275 100,275 120,272 90,272" fill="#879182"/>
</svg>