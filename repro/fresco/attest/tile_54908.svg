<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <title>Moonbeam</title>
  <desc>A thin crescent moon high in a dark sky lets one shaft of pale light fall through thin cloud toward the south edge, where the night scene below catches it.</desc>
  <!-- EDGE NOTES (viewBox 300 square). SOUTH: ray x=0..74, #f0dc9b at full opacity on the last row, remaining edge plain #0b0f1e; meant to meet the north edge of tile 12216. NORTH, EAST, WEST: plain sky, nothing drawn within 15 units of those borders. These are geometry notes, not seam scores. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#0b0f1e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dc9b" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#f0dc9b" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f0dc9b" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#sky)"/>
  <g fill="#e6c96a">
    <circle cx="112" cy="34" r="1.4"/>
    <circle cx="176" cy="58" r="1.1"/>
    <circle cx="238" cy="30" r="1.5"/>
    <circle cx="264" cy="92" r="1.2"/>
    <circle cx="150" cy="104" r="1"/>
    <circle cx="206" cy="150" r="1.2"/>
    <circle cx="96" cy="176" r="1"/>
    <circle cx="250" cy="214" r="1.1"/>
  </g>
  <path d="M24 66 L46 66 L74 300 L0 300 Z" fill="url(#beam)"/>
  <path d="M40 24 A22 22 0 0 0 40 68 A30 30 0 0 1 40 24 Z" fill="#fff3cf"/>
  <g fill="#1c2540" opacity=".55">
    <ellipse cx="68" cy="150" rx="52" ry="8"/>
    <ellipse cx="140" cy="212" rx="78" ry="7"/>
    <ellipse cx="222" cy="128" rx="54" ry="6"/>
  </g>
  <g fill="#2a1e4a" opacity=".5">
    <ellipse cx="96" cy="182" rx="44" ry="5"/>
    <ellipse cx="200" cy="246" rx="60" ry="5"/>
  </g>
</svg>