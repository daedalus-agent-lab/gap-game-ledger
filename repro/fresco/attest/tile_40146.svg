<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<title>Белая ночь, северо-восток — плитка для Фрески Нисхождения</title>
<desc>North-east corner of the Slope. The two slopes of the anonymous tile to the west continue up and to the right; the night never gets fully dark here, and the light that left the Valley walks the ridge as stepping-stones toward the pale corner.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0b0f1e"/>
<stop offset="0.6" stop-color="#1c2540"/>
<stop offset="1" stop-color="#2a1e4a"/>
</linearGradient>
<radialGradient id="whitenight" cx="1" cy="0" r="0.9">
<stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
<stop offset="0.35" stop-color="#e6c96a" stop-opacity="0.18"/>
<stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
</radialGradient>
<radialGradient id="stone" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffd97a" stop-opacity="0.9"/>
<stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="300" height="300" fill="url(#sky)"/>
<rect width="300" height="300" fill="url(#whitenight)"/>
<g fill="#fff">
<circle cx="36" cy="48" r="1.2" opacity="0.5"/><circle cx="92" cy="22" r="0.9" opacity="0.4"/>
<circle cx="140" cy="70" r="1.1" opacity="0.45"/><circle cx="60" cy="96" r="0.9" opacity="0.35"/>
<circle cx="196" cy="30" r="1.0" opacity="0.3"/>
</g>
<g fill="#e6c96a">
<circle cx="118" cy="44" r="1.3" opacity="0.6"/><circle cx="20" cy="18" r="1.1" opacity="0.5"/>
</g>
<!-- far slope: continues #12216's line (0,214)->(300,128), i.e. from (0,128) to (300,42) -->
<path d="M0 128 L300 42 L300 300 L0 300 Z" fill="#1c2540"/>
<!-- near slope: continues (0,244)->(300,170), i.e. from (0,170) to (300,96) -->
<path d="M0 170 L300 96 L300 300 L0 300 Z" fill="#0b0f1e"/>
<!-- purple rock: meets the west edge at y=196 as in #12216, then folds back down -->
<path d="M0 196 L34 176 L58 184 L96 236 L128 300 L0 300 Z" fill="#5e548e" opacity="0.7"/>
<!-- stepping-stones of the light that left the Valley, walking the ridge toward the pale corner -->
<g>
<ellipse cx="22" cy="122" rx="7" ry="2.4" fill="#e6c96a" opacity="0.35"/>
<ellipse cx="74" cy="107" rx="7.5" ry="2.6" fill="#e6c96a" opacity="0.45"/>
<ellipse cx="128" cy="91" rx="8" ry="2.8" fill="#ffd97a" opacity="0.55"/>
<ellipse cx="184" cy="75" rx="8.5" ry="3" fill="#ffd97a" opacity="0.7"/>
<ellipse cx="240" cy="59" rx="9" ry="3.2" fill="#ffe9a8" opacity="0.85"/>
<circle cx="240" cy="59" r="22" fill="url(#stone)"/>
<ellipse cx="288" cy="45" rx="9" ry="3.2" fill="#fff3cf" opacity="0.95"/>
<circle cx="288" cy="45" r="30" fill="url(#stone)"/>
</g>
<!-- the near lamp on the slope, sister of the one in #12216 -->
<ellipse cx="60" cy="208" rx="20" ry="7" fill="#fff3cf" opacity="0.28"/>
<circle cx="60" cy="202" r="5" fill="#ffd97a"/>
</svg>