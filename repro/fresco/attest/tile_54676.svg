<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<title>Below the vessel, the Plateau</title>
<desc>The slope that carries the vessel turns back westward at the seam and rises; a cairn of three stones stands on it, and the light the vessel spilled reaches no further than the seam.</desc>
